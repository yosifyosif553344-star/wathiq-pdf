name: Build Wathiq PDF APK & Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    name: Build & Deploy Flutter Web (GitHub Pages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Web Platform Scaffolding
        run: |
          mkdir -p /tmp/wathiq_web_backup
          cp pubspec.yaml /tmp/wathiq_web_backup/pubspec.yaml
          cp -r lib /tmp/wathiq_web_backup/lib
          cp -r test /tmp/wathiq_web_backup/test
          rm -rf web
          flutter create --platforms=web --project-name wathiq_pdf .
          cp /tmp/wathiq_web_backup/pubspec.yaml pubspec.yaml
          rm -rf lib test
          cp -r /tmp/wathiq_web_backup/lib lib
          cp -r /tmp/wathiq_web_backup/test test
          sed -i 's/<title>wathiq_pdf<\/title>/<title>وثيق PDF<\/title>/g' web/index.html || true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Flutter Web Release
        run: flutter build web --release --base-href "/wathiq-pdf/" --no-tree-shake-icons

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true

  build-android-apk:
    name: Build Release APK (وثيق PDF)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Complete Android & iOS Platform Scaffolding
        run: |
          mkdir -p /tmp/wathiq_backup
          cp pubspec.yaml /tmp/wathiq_backup/pubspec.yaml
          cp -r lib /tmp/wathiq_backup/lib
          cp -r test /tmp/wathiq_backup/test
          rm -rf android ios
          flutter create --platforms=android,ios --org com.wathiq --project-name wathiq_pdf .
          cp /tmp/wathiq_backup/pubspec.yaml pubspec.yaml
          rm -rf lib test
          cp -r /tmp/wathiq_backup/lib lib
          cp -r /tmp/wathiq_backup/test test

      - name: Configure Offline-Only AndroidManifest (No Internet Permission)
        run: |
          python3 - << 'EOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          lines = [
              line for line in content.splitlines()
              if "android.permission.INTERNET" not in line
          ]
          content = "\n".join(lines)

          content = content.replace('android:label="wathiq_pdf"', 'android:label="وثيق PDF"')
          if "android.permission.CAMERA" not in content:
              content = content.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.CAMERA" />\n    <application',
                  1,
              )

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Easy Download
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Wathiq-PDF-v1.0.0.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wathiq-PDF-Release-APK
          path: build/app/outputs/flutter-apk/Wathiq-PDF-v1.0.0.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "وثيق PDF - إصدار الأندرويد (v1.0.${{ github.run_number }})"
          body: |
            ### تطبيق وثيق PDF (Wathiq PDF) - 15 أداة PDF محلية 100%
            - **تنظيم الصفحات:** دمج، تقسيم، ضغط، ترتيب الصفحات، تدوير.
            - **تحرير وتوقيع:** توقيع يدوي، إضافة نص، علامة مائية، ترقيم الصفحات.
            - **إنشاء واستخراج:** صور إلى PDF، ملف جديد، استخراج النص.
            - **الحماية والأمان:** قفل بكلمة مرور، فك القفل، إصلاح.
            - **نسخة الويب المباشرة (Flutter Web):** https://yosifyosif553344-star.github.io/wathiq-pdf/
          files: build/app/outputs/flutter-apk/Wathiq-PDF-v1.0.0.apk
          draft: false
          prerelease: false
