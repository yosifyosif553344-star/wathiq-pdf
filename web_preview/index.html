<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وثيق PDF</title>
<style>
:root{--bg:#0D0F12;--card:#161920;--line:#64748B;--tx:#F1F5F9;--tx2:#94A3B8;--ac:#34D399;--on:#062E22;--err:#F87171}
[data-theme=light]{--bg:#F8FAFC;--card:#FFFFFF;--tx:#0F172A;--tx2:#475569;--ac:#047857;--on:#FFFFFF;--err:#B91C1C}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,'Segoe UI',sans-serif;min-height:100dvh}
.app{max-width:640px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;flex:1}
button{font:inherit;cursor:pointer;border-radius:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);background:transparent;color:var(--tx)}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
button:disabled{opacity:.4;cursor:default}
.icon{border:none;min-width:44px;padding:0;font-size:20px;color:var(--ac)}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.tile b{flex:1}.tile span{color:var(--ac);font-size:22px}.tile i{color:var(--tx2);font-style:normal}
h2{font-size:16px;margin-top:14px}
.muted{color:var(--tx2);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.file{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.file div{flex:1}
select,input,textarea{font:inherit;width:100%;min-height:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
footer{padding:16px}footer button{width:100%}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border-radius:12px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px;text-align:center}
.box .ok{font-size:44px;color:var(--ac)}
.hidden{display:none}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const tools=[
 {id:'compress',t:'ضغط PDF',i:'⇲'},
 {id:'split',t:'تقسيم PDF',i:'✂'},
 {id:'merge',t:'دمج ملفات PDF',i:'⧉'},
 {id:'pdf_to_word',t:'PDF إلى وورد',i:'W'},
 {id:'pdf_to_ppt',t:'PDF إلى بوربوينت',i:'P'},
 {id:'pdf_to_excel',t:'PDF إلى إكسيل',i:'X'},
 {id:'word_to_pdf',t:'وورد إلى PDF',i:'📄'},
 {id:'ppt_to_pdf',t:'بوربوينت إلى PDF',i:'📊'},
 {id:'excel_to_pdf',t:'إكسل إلى PDF',i:'⊞'},
 {id:'edit_pdf',t:'تعديل ملف PDF',i:'✎'},
 {id:'pdf_to_jpg',t:'PDF إلى JPG',i:'🖼'},
 {id:'images_to_pdf',t:'صورة إلى PDF',i:'📷'},
 {id:'page_numbers',t:'ترقيم الصفحات',i:'#'},
 {id:'watermark',t:'العلامة المائية',i:' stamp '},
 {id:'rotate_pdf',t:'تدوير ملفات PDF',i:'⟳'},
 {id:'unlock_pdf',t:'فتح قفل ملفات PDF',i:'🔓'},
 {id:'protect_pdf',t:'حماية ملف PDF',i:'🔒'},
 {id:'organize',t:'تنظيم ملف PDF',i:'▦'},
 {id:'repair_pdf',t:'إصلاح مستند PDF',i:'🛠'},
 {id:'sign_pdf',t:'توقيع مستند PDF',i:'✒'},
 {id:'extract_text',t:'استخراج النصوص',i:'TXT'},
 {id:'ocr_pdf',t:'OCR PDF',i:'🔍'},
 {id:'create_pdf',t:'إنشاء ملف PDF',i:'＋'},
 {id:'compress_image',t:'ضغط الصورة',i:'🖼'},
 {id:'convert_to_jpg',t:'التحويل إلى JPG',i:'JPG'},
 {id:'convert_from_jpg',t:'التحويل من JPG',i:'PNG'}
];
let s={view:'home',tool:null,files:[],done:false,busy:false,
 history:[{n:'محاضرات.pdf',op:'دمج PDF',sz:'3.2 MB'},{n:'عقد.pdf',op:'ضغط PDF',sz:'1.1 MB'}]};
const app=document.getElementById('app');
function toggleTheme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'}
function openTool(id){s.tool=tools.find(t=>t.id===id);s.view='tool';s.files=id==='create_pdf'?[{n:'جديد',p:1}]:[];s.done=false;render()}
function addFile(){const n=s.files.length+1;s.files.push({n:`ملف_${n}.pdf`,p:8});render()}
function render(){
 if(s.view==='home'){app.innerHTML=`
 <header><span style="color:var(--ac);font-size:26px">🛡</span><h1>وثيق PDF</h1><button class="icon" onclick="toggleTheme()">◐</button></header>
 <main>${tools.map(t=>`<div class="tile" onclick="openTool('${t.id}')"><span>${t.i}</span><b>${t.t}</b><i>‹</i></div>`).join('')}
 <h2>آخر الملفات</h2>
 ${s.history.map(h=>`<div class="file"><div><b>${h.n}</b><div class="muted">${h.op} • ${h.sz}</div></div><span class="muted">⋮</span></div>`).join('')}
 </main>`;return}
 const t=s.tool,has=s.files.length>0;
 let body=`<button onclick="addFile()">${has?'تغيير الملف':'اختيار ملف'}</button>`;
 if(has&&t.id!=='create_pdf')body+=`<div class="file"><div><b>${s.files[0].n}</b><div class="muted">${s.files[0].p} صفحة</div></div></div>`;
 if(t.id==='create_pdf')body=`<input placeholder="عنوان المستند" value="مستند جديد"><textarea rows="6" placeholder="محتوى المستند..."></textarea>`;
 else if(t.id==='protect_pdf'||t.id==='unlock_pdf')body+=has?`<input type="password" placeholder="كلمة المرور">`:'';
 else if(t.id==='watermark'||t.id==='edit_pdf')body+=has?`<input placeholder="النص المطلوب" value="سري للغاية">`:'';
 app.innerHTML=`<header><button class="icon" onclick="s.view='home';render()">›</button><h1>${t.t}</h1></header>
 <main>${body}</main>
 <footer><button class="p" ${has&&!s.busy?'':'disabled'} onclick="run()">${s.busy?'جارٍ العمل...':'تنفيذ وحفظ'}</button></footer>
 <div class="modal ${s.done?'':'hidden'}"><div class="box"><div class="ok">✓</div><h2>تم بنجاح</h2><div>${t.t}.pdf</div><div class="muted">1.8 MB</div>
 <button class="p" style="margin-top:10px">مشاركة</button><button onclick="s.done=false;s.view='home';render()">فتح</button></div></div>`}
function run(){s.busy=true;render();setTimeout(()=>{s.busy=false;s.done=true;render()},700)}
render();
</script>
</body>
</html>
