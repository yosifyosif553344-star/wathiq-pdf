name: wathiq_pdf
description: "وثيق PDF (Wathiq PDF) - تطبيق شامل لمعالجة وإدارة ملفات PDF محلياً بالكامل على الجهاز بدون إنترنت."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # محركات معالجة ملفات الـ PDF والصور محلياً بالكامل
  syncfusion_flutter_pdf: ^35.1.42
  pdf: any
  image: any

  # المسح الضوئي بالكاميرا واختيار الملفات والصور
  image_picker: any
  file_picker: ^8.1.7

  # التخزين المحلي وإدارة المسارات والمشاركة
  shared_preferences: any
  path_provider: any
  path: any
  share_plus: any
  open_filex: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
